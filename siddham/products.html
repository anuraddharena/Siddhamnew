<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Products - Siddham</title>
<link rel="icon" href="assets/logo.jpg">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="page-header">
  <a href="index.html"><img src="assets/logo.jpg" alt="Siddham" class="header-logo"></a>
  <div class="header-actions">
    <button id="langBtn" class="lang-btn">English</button>
    <button id="cartBtn" class="cart-btn">🛒 <span data-si="කරත්තය" data-en="Cart">කරත්තය</span> (<span id="cartCount">0</span>)</button>
  </div>
</header>

<section class="page-hero">
  <h1 data-si="අපගේ නිෂ්පාදන" data-en="Our Collection">අපගේ නිෂ්පාදන</h1>
  <p data-si="පිරිසිදු • නැවුම් • ගුණාත්මක" data-en="Pure • Fresh • Premium">පිරිසිදු • නැවුම් • ගුණාත්මක</p>
</section>

<!-- Category filters (built from admin-managed list) -->
<nav class="cat-nav" id="catNav"></nav>

<main id="productGrid" class="grid"></main>

<!-- CART DRAWER -->
<aside id="cartDrawer" class="cart-drawer">
  <div class="cart-head">
    <h2 data-si="ඔබගේ කරත්තය" data-en="Your Cart">ඔබගේ කරත්තය</h2>
    <button id="closeCart" class="close-btn">✕</button>
  </div>
  <div id="cartItems" class="cart-items"></div>
  <div class="cart-foot">
    <div class="cart-row"><span data-si="උප එකතුව" data-en="Subtotal">උප එකතුව</span><span>Rs. <span id="subtotal">0</span></span></div>
    <div class="cart-row"><span data-si="ඇණවුමේ බර" data-en="Weight">ඇණවුමේ බර</span><span><span id="cartWeightG">0</span> g (<span id="cartWeightKg">1</span> kg)</span></div>
    <div class="cart-row" id="deliveryRow" style="display:none"><span data-si="ප්‍රවාහන ගාස්තු" data-en="Delivery">ප්‍රවාහන ගාස්තු</span><span>Rs. <span id="delivery">0</span></span></div>
    <div class="cart-row total"><span data-si="මුළු මුදල" data-en="Total">මුළු මුදල</span><span>Rs. <span id="total">0</span></span></div>
    <div id="cartNotice" class="notice"></div>
    <p class="cod-note" data-si="✓ Cash on Delivery පහසුකම ඇත" data-en="✓ Cash on Delivery available">✓ Cash on Delivery පහසුකම ඇත</p>
    <button id="checkoutBtn" class="checkout-btn" data-si="ඇණවුම තහවුරු කරන්න" data-en="Confirm Order">ඇණවුම තහවුරු කරන්න</button>
  </div>
</aside>
<div id="overlay" class="overlay"></div>

<!-- CHECKOUT MODAL -->
<div id="checkoutModal" class="modal">
  <div class="modal-inner">
    <button id="closeModal" class="close-btn">✕</button>
    <h2 data-si="ඇණවුම් විස්තර" data-en="Order Details">ඇණවුම් විස්තර</h2>
    <p class="modal-sub" data-si="අවශ්‍ය තොරතුරු පුරවන්න" data-en="Please fill in your details">අවශ්‍ය තොරතුරු පුරවන්න</p>
    <form id="orderForm">
      <label data-si="නම" data-en="Full Name">නම <span>*</span></label>
      <input type="text" name="name" required>

      <label data-si="දුරකථන අංකය" data-en="Phone Number">දුරකථන අංකය <span>*</span></label>
      <input type="tel" name="phone" required pattern="[0-9+ ]{9,15}">

      <label data-si="ලිපිනය" data-en="Address">ලිපිනය <span>*</span></label>
      <textarea name="address" required rows="2"></textarea>

      <label data-si="ප්‍රදේශය (දිස්ත්‍රික්කය)" data-en="District">ප්‍රදේශය (දිස්ත්‍රික්කය) <span>*</span></label>
      <select name="district" id="districtSel" required>
        <option value="" data-si="-- දිස්ත්‍රික්කය තෝරන්න --" data-en="-- Select District --">-- දිස්ත්‍රික්කය තෝරන්න --</option>
      </select>

      <label data-si="ලගම නගරය" data-en="Nearest City">ලගම නගරය <span>*</span></label>
      <select name="city" id="citySel" required>
        <option value="" data-si="-- පළමුව දිස්ත්‍රික්කය තෝරන්න --" data-en="-- Select District first --">-- පළමුව දිස්ත්‍රික්කය තෝරන්න --</option>
      </select>

      <label data-si="ඇණවුමේ බර (auto)" data-en="Order Weight (auto)">ඇණවුමේ බර (auto)</label>
      <input type="text" name="weight" id="weightIn" value="1 kg" readonly style="background:#faf5e8;font-weight:600">

      <div class="charge-box">
        <span data-si="ප්‍රවාහන ගාස්තුව:" data-en="Delivery Charge:">ප්‍රවාහන ගාස්තුව:</span>
        <strong>Rs. <span id="chargeShow">0</span></strong>
      </div>

      <div class="charge-box total">
        <span data-si="මුළු මුදල:" data-en="Grand Total:">මුළු මුදල:</span>
        <strong>Rs. <span id="finalTotal">0</span></strong>
      </div>

      <!-- Special delivery notices -->
      <div id="deliveryNotice" class="notice"></div>

      <label data-si="සටහන් (විකල්පයකි)" data-en="Notes (optional)">සටහන් (විකල්පයකි)</label>
      <textarea name="notes" rows="2"></textarea>

      <p class="cod-note" data-si="💵 Cash on Delivery ලෙස ගෙවීම කළ හැක" data-en="💵 Payment by Cash on Delivery">💵 Cash on Delivery ලෙස ගෙවීම කළ හැක</p>

      <div class="submit-row">
        <button type="submit" class="wa-btn">📱 WhatsApp <span data-si="මගින් යවන්න" data-en="Order">මගින් යවන්න</span></button>
        <button type="button" id="emailBtn" class="email-btn">✉️ Email <span data-si="මගින් යවන්න" data-en="Order">මගින් යවන්න</span></button>
      </div>
    </form>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/main.js"></script>
<script src="js/shop.js"></script>
</body>
</html>
